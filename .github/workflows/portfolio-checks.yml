name: Portfolio checks
on:
  pull_request:
    paths: ['proposal/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/portfolio-checks.yml']
  push:
    branches: ['feat/freelance-portfolio']
    paths: ['proposal/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/portfolio-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run build
